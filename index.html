<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tecnocareVoice v0.6</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #2196F3; color: white; overflow: hidden; }
        #app-info { position: fixed; top: 10px; right: 10px; color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; z-index: 100; padding: 10px; }

        /* --- 1. 上半分：表示エリア (50vh) --- */
        #upper-area { height: 50vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; position: relative; }
        
        /* 宛先表示（左上固定） */
        #target-display { font-size: 1.8rem; font-weight: bold; text-align: left; margin-bottom: 10px; min-height: 2.2rem; }
        
        /* 本文・メッセージ表示 */
        #message-display { flex: 1; font-size: 2.2rem; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; line-height: 1.4; }

        /* ★ロボット画像（メッセージの下に配置）★ */
        #robot-container { height: 180px; display: flex; justify-content: center; align-items: center; }
        #robot-image { width: 160px; height: auto; transition: transform 0.3s ease-in-out; }

        /* --- 2. 下半分：操作エリア (50vh) --- */
        #lower-area { height: 50vh; border-top: 4px solid white; display: flex; flex-direction: column; }

        /* 宛先選択（ドラムロール）時 */
        #selector-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1976D2; }
        #drum-text { font-size: 3rem; font-weight: bold; margin-bottom: 20px; }
        #drum-controls { display: flex; gap: 20px; }
        .drum-btn { padding: 15px 40px; font-size: 1.5rem; font-weight: bold; background: white; color: #1976D2; border-radius: 50px; border: none; }
        .decide-btn { background: #FFEB3B; color: #333; }

        /* 録音ボタン（全画面） */
        #mic-btn { flex: 1; display: none; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold; background: #f44336; cursor: pointer; }

        /* 送信・やり直し（左右真っ二つ） */
        #confirm-area { flex: 1; display: none; }
        .split-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; }
        #send-btn { background: #4CAF50; border-right: 2px solid white; }
        #retry-btn { background: #757575; }

        .loading { background: #9e9e9e !important; }

        /* 設定モーダル（略） */
        #settings-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="app-info" onclick="handleSecretTap()">tecnocareVoice</div>

    <div id="upper-area">
        <div id="target-display"></div>
        <div id="message-display">1: 読み込み中...</div>
        <div id="robot-container">
            <img id="robot-image" src="select.png">
        </div>
    </div>

    <div id="lower-area">
        <div id="selector-area">
            <div id="drum-text"></div>
            <div id="drum-controls">
                <button class="drum-btn" onclick="nextRecipient()">次へ</button>
                <button class="drum-btn decide-btn" onclick="decideRecipient()">決定</button>
            </div>
        </div>
        <div id="mic-btn" onclick="toggleRecording()">録音する</div>
        <div id="confirm-area">
            <div id="send-btn" class="split-btn" onclick="sendData()">送信</div>
            <div id="retry-btn" class="split-btn" onclick="retry()">戻る</div>
        </div>
    </div>

    <div id="settings-modal">...</div>

    <script>
        const GAS_URL = "田中さんのURL";
        let config = { fromName:"", fromEmail:"", outputMode:"標準", recipients:Array(5).fill({name:"", email:"", context:"家族向け"}) };
        let currentDrumIdx = 0;
        let lastAnalysis = null;
        let thinkTimer = null;
        let thinkFrame = 1;

        const robotImg = document.getElementById('robot-image');
        const targetDisp = document.getElementById('target-display');
        const msgDisp = document.getElementById('message-display');

        // ★ロボットの状態変更★
        function updateRobot(status) {
            if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
            if (status === 'select') {
                robotImg.src = 'select.png'; robotImg.style.transform = 'rotate(0deg)';
            } else if (status === 'thinking') {
                thinkFrame = 1;
                thinkTimer = setInterval(() => {
                    thinkFrame = (thinkFrame % 3) + 1;
                    robotImg.src = `thinking${thinkFrame}.png`;
                    const angles = [-5, 0, 5];
                    robotImg.style.transform = `rotate(${angles[thinkFrame-1]}deg)`;
                }, 1000);
            } else if (status === 'decide') {
                robotImg.src = 'decide.png'; robotImg.style.transform = 'rotate(0deg)';
            }
        }

        function updateDrumDisplay() {
            const r = config.recipients[currentDrumIdx] || {name:"(未登録)"};
            document.getElementById('drum-text').innerText = `${currentDrumIdx + 1}: ${r.name}`;
            msgDisp.innerText = "だれに おくりますか？";
            updateRobot('select');
        }

        function decideRecipient() {
            const r = config.recipients[currentDrumIdx];
            targetDisp.innerText = `${r.name} さんへ`;
            msgDisp.innerText = "ボタンを おしてから\nおはなし してください";
            document.getElementById('selector-area').style.display = 'none';
            document.getElementById('mic-btn').style.display = 'flex';
        }

        let mediaRecorder, audioChunks = [];
        async function toggleRecording() {
            const micBtn = document.getElementById('mic-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = handleRecordingStop;
                mediaRecorder.start();
                micBtn.innerText = "おわったら たたく";
                micBtn.style.background = "#FFEB3B"; micBtn.style.color = "#333";
            } else {
                mediaRecorder.stop();
                micBtn.innerText = "解析中..."; micBtn.classList.add('loading');
                msgDisp.innerText = "かんがえちゅう...";
                updateRobot('thinking');
            }
        }

        async function handleRecordingStop() {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const base64 = await new Promise(r => { const reader = new FileReader(); reader.onloadend = () => r(reader.result.split(',')[1]); reader.readAsDataURL(blob); });
            const activeR = config.recipients[currentDrumIdx];
            
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ version: "salvage", action: "analyze", audio: base64, email: config.fromEmail, toWho: activeR.name, context: activeR.context, outputMode: config.outputMode }) });
                const json = await res.json();
                if (json.status === "success") {
                    lastAnalysis = json.analysis; lastAnalysis.row = json.row;
                    msgDisp.innerText = lastAnalysis.inference;
                    updateRobot('decide');
                    document.getElementById('mic-btn').style.display = 'none';
                    document.getElementById('confirm-area').style.display = 'flex';
                }
            } catch (err) { alert(err); retry(); }
        }

        async function sendData() {
            const activeR = config.recipients[currentDrumIdx];
            msgDisp.innerText = "おくっています...";
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ version: "salvage", action: "send", analysis: lastAnalysis, row: lastAnalysis.row, settings: { fromName:config.fromName, fromEmail:config.fromEmail, toName:activeR.name, toEmail:activeR.email } }) });
            alert("おくりました！"); retry();
        }

        function retry() {
            lastAnalysis = null;
            targetDisp.innerText = "";
            document.getElementById('selector-area').style.display = 'flex';
            document.getElementById('mic-btn').style.display = 'none';
            document.getElementById('mic-btn').classList.remove('loading');
            document.getElementById('mic-btn').style.background = "#f44336";
            document.getElementById('mic-btn').style.color = "white";
            document.getElementById('confirm-area').style.display = 'none';
            updateDrumDisplay();
        }

        // 起動時処理・設定保存等は以前のロジックを継承
    </script>
</body>
</html>
