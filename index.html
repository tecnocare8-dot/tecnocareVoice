<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tecnocareVoice v0.4</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #2196F3; color: white; overflow: hidden; }
        
        /* 右上の隠し設定ボタン */
        #app-info { position: fixed; top: 10px; right: 10px; color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; user-select: none; z-index: 100; padding: 10px; }
        
        /* 1. 録音前のドラム式宛先選択エリア（画面上半分） */
        #selector-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1976D2; }
        #drum-display { font-size: 3rem; font-weight: bold; margin-bottom: 20px; transition: all 0.2s; height: 4rem; display: flex; align-items: center; }
        #drum-controls { display: flex; gap: 20px; width: 100%; justify-content: center; }
        .drum-btn { padding: 15px 40px; font-size: 1.5rem; font-weight: bold; background: white; color: #1976D2; border-radius: 50px; border: none; cursor: pointer; }
        .decide-btn { background: #FFEB3B; color: #333; }

        /* 解析結果表示エリア（決定後に表示） */
        #display { display: none; flex: 1; padding: 20px; font-size: 2rem; align-items: center; justify-content: center; text-align: center; }

        /* コントロールエリア（画面下40%） */
        #control-area { height: 40vh; display: none; flex-direction: column; border-top: 4px solid white; }
        .full-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; text-align: center; }
        #confirm-row { flex: 1; display: none; }
        .half-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; border-right: 2px solid white; }
        
        #mic-btn { background: #f44336; }
        #send-btn { background: #4CAF50; }
        #retry-btn { background: #757575; border-right: none; }
        .loading { background: #9e9e9e !important; cursor: wait; }

        /* 設定モーダル */
        #settings-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .setting-group { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input[type="text"], input[type="email"], select { width: 100%; font-size: 1.2rem; margin: 5px 0 10px; padding: 10px; box-sizing: border-box; }
        button.save-btn { width: 100%; padding: 20px; font-size: 1.5rem; font-weight: bold; background: #4CAF50; color: white; border: none; border-radius: 10px; margin-bottom: 50px;}
    </style>
</head>
<body>
    <div id="app-info" onclick="handleSecretTap()">tecnocareVoice</div>

    <div id="selector-area">
        <div id="drum-display">1: 読み込み中...</div>
        <div id="drum-controls">
            <button class="drum-btn" onclick="nextRecipient()">次へ</button>
            <button class="drum-btn decide-btn" onclick="decideRecipient()">決定</button>
        </div>
    </div>

    <div id="display"></div>

    <div id="control-area">
        <div id="mic-btn" class="full-btn">録音する</div>
        <div id="confirm-row" class="full-btn">
            <div id="send-btn" class="half-btn">送信</div>
            <div id="retry-btn" class="half-btn">戻る</div>
        </div>
    </div>

    <div id="settings-modal">
        <h2 style="color:#FFEB3B">設定 (5回タップ)</h2>
        <div class="setting-group">
            <label>自分の名前</label><input type="text" id="from-name">
            <label>自分のメール</label><input type="email" id="from-email">
            <label>表記モード</label>
            <select id="output-mode">
                <option value="標準">標準（漢字あり）</option>
                <option value="ひらがな分かち書き">ひらがな分かち書き</option>
            </select>
        </div>
        <div id="recipient-config-list"></div>
        <button class="save-btn" onclick="saveSettings()">設定を保存して閉じる</button>
        <button onclick="document.getElementById('settings-modal').style.display='none'" style="width:100%; background:none; color:white; border:none; padding:10px;">キャンセル</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyGraAOg3D5JFCP8Mb7TKf_MkwmM71rl0mOjj_PkVzRGMLJMl_Qln-fx3nmOVnhMPoqhQ/exec";
        
        // --- 初期値のテンプレート ---
        const DEFAULT_CONFIG = { 
            fromName:"", 
            fromEmail:"", 
            outputMode:"標準", 
            recipients:Array(5).fill(null).map(() => ({name:"", email:"", context:"家族向け"})) 
        };
        let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        let currentDrumIdx = 0;
        let tapCount = 0;

        // 設定ファイルの読み込み
        window.onload = () => {
            try {
                const saved = localStorage.getItem('awesome_voice_config');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // 宛先リストが正しく配列かチェック
                    if (parsed && Array.isArray(parsed.recipients)) {
                        config = parsed;
                    } else {
                        throw new Error("Invalid format");
                    }
                } else {
                    // 初回起動時などのメッセージ
                    console.log("No config found. Using default.");
                }
            } catch (e) {
                // 破損・不整合時のアラートと初期化
                alert("設定ファイルが壊れています。再度設定してください。");
                config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            }
            renderRecipientConfig();
            updateDrumDisplay();
        };

        // 5回タップで設定画面へ
        function handleSecretTap() {
            tapCount++;
            if (tapCount >= 5) {
                tapCount = 0;
                openSettings();
            }
            setTimeout(() => { tapCount = 0; }, 3000); 
        }

        function openSettings() {
            document.getElementById('from-name').value = config.fromName || "";
            document.getElementById('from-email').value = config.fromEmail || "";
            document.getElementById('output-mode').value = config.outputMode || "標準";
            
            for (let i = 0; i < 5; i++) {
                const r = config.recipients[i] || {name:"", email:"", context:"家族向け"};
                document.getElementById(`to-name-${i}`).value = r.name || "";
                document.getElementById(`to-email-${i}`).value = r.email || "";
                document.getElementById(`context-${i}`).value = r.context || "家族向け";
            }
            document.getElementById('settings-modal').style.display = 'block';
        }

        function renderRecipientConfig() {
            const list = document.getElementById('recipient-config-list');
            list.innerHTML = "";
            for(let i=0; i<5; i++){
                list.innerHTML += `
                <div class="setting-group">
                    <h3>宛先 ${i+1}</h3>
                    <label>名前</label><input type="text" id="to-name-${i}">
                    <label>メール</label><input type="email" id="to-email-${i}">
                    <label>文体</label>
                    <select id="context-${i}">
                        <option value="家族向け">家族向け</option>
                        <option value="友人向け">友人向け</option>
                        <option value="仕事/ST向け">仕事/ST向け</option>
                    </select>
                </div>`;
            }
        }

        function saveSettings() {
            config.fromName = document.getElementById('from-name').value;
            config.fromEmail = document.getElementById('from-email').value;
            config.outputMode = document.getElementById('output-mode').value;
            config.recipients = [0,1,2,3,4].map(i => ({
                name: document.getElementById(`to-name-${i}`).value,
                email: document.getElementById(`to-email-${i}`).value,
                context: document.getElementById(`context-${i}`).value
            }));
            localStorage.setItem('awesome_voice_config', JSON.stringify(config));
            updateDrumDisplay();
            document.getElementById('settings-modal').style.display = 'none';
        }

        function nextRecipient() {
            currentDrumIdx = (currentDrumIdx + 1) % 5;
            updateDrumDisplay();
        }

        function updateDrumDisplay() {
            const drum = document.getElementById('drum-display');
            if (!drum) return;

            const r = (config.recipients && config.recipients[currentDrumIdx]) 
                      ? config.recipients[currentDrumIdx] 
                      : { name: "(未設定)" };

            const name = r.name || "(未登録)";
            drum.style.opacity = 0;
            setTimeout(() => {
                drum.innerText = `${currentDrumIdx + 1}: ${name}`;
                drum.style.opacity = 1;
            }, 100);
        }

        function decideRecipient() {
            document.getElementById('selector-area').style.display = 'none';
            document.getElementById('display').style.display = 'flex';
            const currentName = (config.recipients[currentDrumIdx] && config.recipients[currentDrumIdx].name) 
                                ? config.recipients[currentDrumIdx].name 
                                : "(未設定)";
            document.getElementById('display').innerText = `${currentName} さんへお話しください`;
            document.getElementById('control-area').style.display = 'flex';
        }

        /* 録音・通信ロジック */
        let mediaRecorder, audioChunks = [], lastAnalysis = null;
        const micBtn = document.getElementById('mic-btn');

        micBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = handleRecordingStop;
                mediaRecorder.start();
                micBtn.style.background = "#ffeb3b"; micBtn.innerText = "終わったら叩く";
            } else {
                mediaRecorder.stop();
                micBtn.innerText = "解析中..."; micBtn.classList.add('loading');
            }
        };

        async function handleRecordingStop() {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const base64 = await new Promise(r => { const reader = new FileReader(); reader.onloadend = () => r(reader.result.split(',')[1]); reader.readAsDataURL(blob); });
            const activeR = config.recipients[currentDrumIdx] || {name:"", context:"家族向け"};
            
            try {
                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        action: "analyze", audio: base64, email: config.fromEmail,
                        toWho: activeR.name, context: activeR.context, outputMode: config.outputMode 
                    }) 
                });
                const json = await res.json();
                if (json.status === "success") {
                    lastAnalysis = json.analysis;
                    lastAnalysis.row = json.row;
                    document.getElementById('display').innerText = lastAnalysis.inference;
                    micBtn.style.display = "none"; document.getElementById('confirm-row').style.display = "flex";
                }
            } catch (err) { alert("エラー: " + err); resetUI(); }
        }

        document.getElementById('send-btn').onclick = async () => {
            const activeR = config.recipients[currentDrumIdx];
            document.getElementById('display').innerText = "送信中...";
            document.getElementById('confirm-row').style.display = "none";
            const settings = { fromName:config.fromName, fromEmail:config.fromEmail, toName:activeR.name, toEmail:activeR.email };
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "send", analysis: lastAnalysis, row: lastAnalysis.row, settings: settings }) });
            alert("送信しました"); resetUI();
        };

        document.getElementById('retry-btn').onclick = () => resetUI();

        function resetUI() {
            document.getElementById('selector-area').style.display = 'flex';
            document.getElementById('display').style.display = 'none';
            document.getElementById('control-area').style.display = 'none';
            micBtn.style.display = "flex"; micBtn.innerText = "録音する"; micBtn.style.background = "#f44336";
            micBtn.classList.remove('loading');
            updateDrumDisplay();
        }
    </script>
</body>
</html>
