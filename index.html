<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AwesomeVoice v0.4 (Salvage)</title>
    <style>
        /* 既存のスタイルを継承しつつ拡張 */
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #2196F3; color: white; overflow: hidden; }
        #app-info { position: fixed; top: 10px; right: 10px; color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; z-index: 100; }
        
        /* 宛先クイック選択（ドラム式） */
        #recipient-selector { background: #1976D2; padding: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        #target-select { font-size: 1.2rem; padding: 5px 10px; border-radius: 5px; border: none; background: white; color: #333; }

        #display { flex: 1; padding: 20px; font-size: 1.8rem; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #control-area { height: 35vh; display: flex; flex-direction: column; border-top: 4px solid white; }
        .full-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; text-align: center; }
        #confirm-row { flex: 1; display: none; }
        .half-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; border-right: 2px solid white; }
        
        #mic-btn { background: #f44336; }
        #send-btn { background: #4CAF50; }
        #retry-btn { background: #757575; border-right: none; }
        .loading { background: #9e9e9e !important; cursor: wait; }

        /* 設定モーダル（5件登録用） */
        #settings-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .setting-group { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .setting-group h3 { margin-top: 0; color: #FFEB3B; }
        input[type="text"], input[type="email"], select { width: 100%; font-size: 1.1rem; margin: 5px 0 10px; padding: 8px; box-sizing: border-box; }
        .mode-select { display: flex; gap: 20px; margin: 10px 0; }
        button.save-btn { width: 100%; padding: 15px; font-size: 1.3rem; font-weight: bold; cursor: pointer; border-radius: 5px; border:none; background: #4CAF50; color: white; margin-bottom: 40px;}
    </style>
</head>
<body>
    <div id="app-info">AwesomeVoice v0.4 Setting</div>

    <div id="recipient-selector">
        <span>送る相手:</span>
        <select id="target-select">
            <option value="0">1: (未登録)</option>
            <option value="1">2: (未登録)</option>
            <option value="2">3: (未登録)</option>
            <option value="3">4: (未登録)</option>
            <option value="4">5: (未登録)</option>
        </select>
    </div>

    <div id="display">画面下の「録音する」を叩いて<br>お話しください</div>

    <div id="control-area">
        <div id="mic-btn" class="full-btn">録音する</div>
        <div id="confirm-row" class="full-btn">
            <div id="send-btn" class="half-btn">送信</div>
            <div id="retry-btn" class="half-btn">戻る</div>
        </div>
    </div>

    <div id="settings-modal">
        <h2>アプリ設定</h2>
        
        <div class="setting-group">
            <h3>共通設定</h3>
            <label>あなたの名前</label><input type="text" id="from-name">
            <label>あなたのメール</label><input type="email" id="from-email">
            <label>表示モード</label>
            <div class="mode-select">
                <label><input type="radio" name="outputMode" value="標準" checked> 標準</label>
                <label><input type="radio" name="outputMode" value="ひらがな分かち書き"> 分かち書き</label>
            </div>
        </div>

        <div id="recipient-forms">
            </div>

        <button class="save-btn" onclick="saveSettings()">設定を保存して閉じる</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyGraAOg3D5JFCP8Mb7TKf_MkwmM71rl0mOjj_PkVzRGMLJMl_Qln-fx3nmOVnhMPoqhQ/exec";
        const MAX_TIME = 45; const SILENCE_TIME = 5; const SILENCE_THRESHOLD = 0.01;
        let mediaRecorder, audioChunks = [], lastAnalysis = null, audioContext, analyser, dataArray, silenceTimer, recordingTimer;
        
        const micBtn = document.getElementById('mic-btn'), confirmRow = document.getElementById('confirm-row'), display = document.getElementById('display'), targetSelect = document.getElementById('target-select');

        // ページ読み込み時に宛先リストを更新
        window.onload = () => { loadSettings(); updateTargetSelector(); };

        // 宛先5件のフォームを生成
        const recipientForms = document.getElementById('recipient-forms');
        for(let i=0; i<5; i++) {
            recipientForms.innerHTML += `
                <div class="setting-group">
                    <h3>宛先 ${i+1}</h3>
                    <label>相手の名前</label><input type="text" id="to-name-${i}">
                    <label>メールアドレス</label><input type="email" id="to-email-${i}">
                    <label>文体</label>
                    <select id="context-${i}">
                        <option value="家族向け">家族向け（温かい）</option>
                        <option value="友人向け">友人向け（親しい）</option>
                        <option value="仕事/ST向け">仕事/ST向け（丁寧）</option>
                    </select>
                </div>
            `;
        }

        document.getElementById('app-info').onclick = () => { document.getElementById('settings-modal').style.display = 'block'; };

        function saveSettings() {
            const recipients = [];
            for(let i=0; i<5; i++) {
                recipients.push({
                    name: document.getElementById(`to-name-${i}`).value,
                    email: document.getElementById(`to-email-${i}`).value,
                    context: document.getElementById(`context-${i}`).value
                });
            }
            const config = {
                fromName: document.getElementById('from-name').value,
                fromEmail: document.getElementById('from-email').value,
                outputMode: document.querySelector('input[name="outputMode"]:checked').value,
                recipients: recipients
            };
            localStorage.setItem('awesome_voice_v4_config', JSON.stringify(config));
            updateTargetSelector();
            document.getElementById('settings-modal').style.display = 'none';
        }

        function loadSettings() {
            const saved = localStorage.getItem('awesome_voice_v4_config');
            if (!saved) return;
            const c = JSON.parse(saved);
            document.getElementById('from-name').value = c.fromName || "";
            document.getElementById('from-email').value = c.fromEmail || "";
            if(c.outputMode) document.querySelector(`input[name="outputMode"][value="${c.outputMode}"]`).checked = true;
            
            c.recipients.forEach((r, i) => {
                document.getElementById(`to-name-${i}`).value = r.name || "";
                document.getElementById(`to-email-${i}`).value = r.email || "";
                document.getElementById(`context-${i}`).value = r.context || "家族向け";
            });
        }

        function updateTargetSelector() {
            const saved = localStorage.getItem('awesome_voice_v4_config');
            if (!saved) return;
            const c = JSON.parse(saved);
            targetSelect.innerHTML = "";
            c.recipients.forEach((r, i) => {
                const label = r.name ? `${i+1}: ${r.name}` : `${i+1}: (未登録)`;
                const opt = new Option(label, i);
                targetSelect.add(opt);
            });
        }

        /* 録音・解析ロジック（GASの新しいパラメータに対応） */
        micBtn.onclick = () => { if (!mediaRecorder || mediaRecorder.state === "inactive") startRecording(); else stopRecording(); };

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            source.connect(analyser);
            dataArray = new Float32Array(analyser.fftSize);
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = handleRecordingStop;
            mediaRecorder.start();
            micBtn.style.background = "#ffeb3b"; micBtn.innerText = "終わったら叩く";
            detectSilence();
        }

        function detectSilence() {
            if (!mediaRecorder || mediaRecorder.state !== "recording") return;
            analyser.getFloatTimeDomainData(dataArray);
            let peak = 0;
            for (let i = 0; i < dataArray.length; i++) if (Math.abs(dataArray[i]) > peak) peak = Math.abs(dataArray[i]);
            if (peak < SILENCE_THRESHOLD) { if (!silenceTimer) silenceTimer = setTimeout(() => stopRecording(), SILENCE_TIME * 1000); }
            else { clearTimeout(silenceTimer); silenceTimer = null; }
            requestAnimationFrame(detectSilence);
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                micBtn.innerText = "解析中..."; micBtn.classList.add('loading');
            }
        }

        async function handleRecordingStop() {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const base64 = await new Promise(r => { const reader = new FileReader(); reader.onloadend = () => r(reader.result.split(',')[1]); reader.readAsDataURL(blob); });
            
            const config = JSON.parse(localStorage.getItem('awesome_voice_v4_config') || "{}");
            const activeRecipient = config.recipients[targetSelect.value];

            try {
                // GASへ「メアド」「宛先名」「文体」「表示モード」を全て送信
                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        action: "analyze", 
                        audio: base64, 
                        email: config.fromEmail,
                        toWho: activeRecipient.name,
                        context: activeRecipient.context,
                        outputMode: config.outputMode
                    }) 
                });
                const json = await res.json();
                if (json.status === "success") {
                    lastAnalysis = json.analysis;
                    lastAnalysis.row = json.row;
                    display.innerText = lastAnalysis.inference;
                    micBtn.style.display = "none"; confirmRow.style.display = "flex";
                }
            } catch (err) { display.innerText = "エラー: " + err.message; setTimeout(resetUI, 3000); }
        }

        document.getElementById('send-btn').onclick = async () => {
            const config = JSON.parse(localStorage.getItem('awesome_voice_v4_config') || "{}");
            const activeRecipient = config.recipients[targetSelect.value];
            display.innerText = "送信中..."; confirmRow.style.display = "none";
            
            // 送信用セッティングを動的に構成
            const sendSettings = {
                fromName: config.fromName,
                fromEmail: config.fromEmail,
                toName: activeRecipient.name,
                toEmail: activeRecipient.email
            };

            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "send", analysis: lastAnalysis, row: lastAnalysis.row, settings: sendSettings }) });
            alert("送信しました"); resetUI();
        };

        document.getElementById('retry-btn').onclick = () => { resetUI(); };

        function resetUI() {
            micBtn.style.display = "flex"; confirmRow.style.display = "none";
            micBtn.innerText = "録音する"; micBtn.style.background = "#f44336";
            micBtn.classList.remove('loading'); display.innerText = "画面を叩いてお話しください";
        }
    </script>
</body>
</html>
